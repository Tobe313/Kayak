# Kayak: a tag vX.Y builds, tests, signs and releases the packages through the Firmware Hub's shared workflow
# zvenson/fm1-build (@v1), so the hub's card shows "Built from source on GitHub" (thefirmwarehub.com/kb/#sign). The
# build makes the dev packages the tests expect (the SMK-37 first, the FM-1 last), then the release ones: those are
# attested and attached. A test build without a release: test.yml, by hand.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:         # (by hand: the same build and tests, attested, no release: fm1-build releases on a tag only)

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write        # the release
      id-token: write        # the signing certificate
      attestations: write    # the attestation
    with:
      build: |
        V="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || V=0.0
        BOARD=smk37 sh build.sh && BOARD=smk37 MODEL=elite sh build.sh && BOARD=smk37 MODEL=mke sh build.sh && sh build.sh
        BOARD=smk37 sh build.sh --release "$V" && BOARD=smk37 MODEL=elite sh build.sh --release "$V"
        BOARD=smk37 MODEL=mke sh build.sh --release "$V" && sh build.sh --release "$V"
      packages: build/kayak-[0-9]*.fwsc
      test: sh tests/run_tests.sh
